<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen Calculator</title>
    <link rel="stylesheet" href="Petaindex.css">
</head>
<center><body>
  <div class="header-container">
    <h1>Food Menu Calculator</h1>
    <p>Buy Now!</p>
</div>


<div class="main-container"></div>

<div class="menu-container"></div>
    <button onclick="Pagkain(0)">Burger - 50 (5% off)</button>
    <button onclick="Pagkain(1)">Fries - 30 (No discount)</button>
    <button onclick="Pagkain(2)">Juice - 20 (2% off)</button>
    <button onclick="Pagkain(3)">Sandwich - 40 (10% off)</button>
    <button onclick="Pagkain(4)">Donut - 25 (5% off)</button>
</div>
    <h3>Items Clicked:</h3>
    <div id="items"></div>

    <h3>Total Price <span id="total">0</span></h3>
    <h3>Total Discount: <span id="discount">0</span></h3>
    <h3>Final Price: <span id="final">0</span></h3>
    <p id="suii"></p>


    <button onclick="clearAll()">Clear</button>


    <script src="petaindexs.js"></script>
</body>
</html>
